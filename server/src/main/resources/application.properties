spring.profiles.active=local

spring.application.name=moa
spring.datasource.url=jdbc:mysql://localhost:3306/moa?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# create(시작 때마다 재생성), update(데이터 유지하고 바뀐것만 추가), validate(검사만)), none
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# 개발용 값.
jwt.expiration-ms=86400000