# [역할] 배포(Railway) 전용 설정. SPRING_PROFILES_ACTIVE=prod일 때 application.properties 위에 덮어씀
# - 비밀값은 이 파일에 적지 않고 Railway 환경변수에서 읽는다 → 이 파일은 git에 올려도 안전
# - ${이름}: 시작할 때 환경변수 값으로 바뀜. 기본값을 안 줬으므로 없으면 서버가 시작 실패 (누락을 바로 알 수 있음)

# Railway가 정해 주는 포트 (로컬에서 prod로 테스트할 때를 위해 기본값 8080)
server.port=${PORT:8080}

# DB: Railway MySQL이 제공하는 변수 (Railway 내부 네트워크라 SSL 없이 접속)
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}

# JWT 서명 키 (로컬의 application-local.properties 역할)
# 기본값 없음 → Railway에 JWT_SECRET을 안 넣으면 서버가 시작하지 않음 (실수로 약한 키로 뜨는 것 방지)
jwt.secret=${JWT_SECRET}


# 운영에서는 SQL 로그 끔 (로그 양 줄이기, 요청 데이터가 로그에 남지 않게)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# 테이블은 검사만 (엔티티와 다르면 서버 시작 실패). 테이블 생성·변경은 db/schema.sql을 사람이 실행
spring.jpa.hibernate.ddl-auto=validate
